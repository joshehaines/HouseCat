included:
  - App
  - Widgets
  - Watch
  - Mac
  - Packages
excluded:
  - build
  - Packages/*/.build
line_length:
  warning: 140
  error: 200
identifier_name:
  excluded: [x, y, i, j, w, d, dx, dy, id, r1, g1, b1, a1, r2, g2, b2, a2, x0, y0, x1, y1]
type_body_length:
  warning: 400
file_length:
  warning: 800
function_body_length:
  warning: 80
disabled_rules:
  - trailing_comma
  - opening_brace
