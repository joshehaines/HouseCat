# The source of truth for the Xcode project. Edit this file and run
# `xcodegen generate`; never hand-edit HouseCat.xcodeproj.
name: HouseCat

options:
  bundleIdPrefix: com.housecatgame
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Empty until the Apple Developer account is live; simulator builds sign locally.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  HouseCatCore:
    path: Packages/HouseCatCore
  HouseCatModels:
    path: Packages/HouseCatModels
  HouseCatUI:
    path: Packages/HouseCatUI
  HouseCatGame:
    path: Packages/HouseCatGame
  HouseCatStore:
    path: Packages/HouseCatStore

targets:
  # iPhone and iPad app: SwiftUI shell + SpriteKit scenes.
  HouseCat:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - Shared/Sources
      # The widget's files, intents and views, shared so the app can write what it reads and draw it too.
      - Widgets/Shared
      - App/Resources
      - path: Shared/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Content
        type: folder
        buildPhase: resources
      - path: App/Art
        type: folder
        buildPhase: resources
      - path: App/Audio
        type: folder
        buildPhase: resources
    dependencies:
      - package: HouseCatCore
      - package: HouseCatModels
      - package: HouseCatUI
      - package: HouseCatGame
      - package: HouseCatStore
      - target: HouseCatWidgets
      - target: HouseCatWatch
      - target: HouseCatDownloader
    entitlements:
      path: App/HouseCat.entitlements
      # xcodegen writes the file from these. The App Group is the widget's shared save (it works in the
      # simulator now; a device build needs the team and the group on the App ID), WeatherKit the real weather.
      properties:
        com.apple.security.application-groups: [group.com.housecatgame.housecat]
        com.apple.developer.weatherkit: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HouseCat
        ITSAppUsesNonExemptEncryption: false
        # Co-owning through CloudKit (Shared/Sources/HouseholdSync.swift): on once the iCloud container is on the App ID.
        HouseCatCloudKit: false
        # Empty until the PostHog project exists: analytics stay off (Shared/Sources/Analytics.swift).
        PostHogAPIKey: ""
        NSHealthShareUsageDescription: "Your cat notices your steps, sleep and workouts and gives you extra XP when you meet a goal. HouseCat only reads them, and they stay on this device."
        # An invite link opens in the app.
        CKSharingSupported: true
        # The nap timer on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # housecat://visit: the widget's Visit button and a tap on the widget.
        CFBundleURLTypes:
          - CFBundleURLName: com.housecatgame.housecat
            CFBundleURLSchemes: [housecat]
        # Empty until the RevenueCat project exists; the app uses StoreKit 2 directly until then.
        RevenueCatAPIKey: ""
        # The homes' exterior packs (Background Assets, Apple-hosted): Shared/Sources/HomePacks.swift.
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
        BAAppGroupID: group.com.housecatgame.housecat
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          # Centred on the whole screen, as the launch curtain draws it after (the safe area moved it 24 points).
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # A landscape game on iPhone (Josh, 17 Oct); the iPad keeps every orientation for multitasking.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housecatgame.housecat
        PRODUCT_NAME: HouseCat
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # StoreKit tests, hosted in the app so they run in the simulator.
  HouseCatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
      - path: Store/HouseCat.storekit
        type: file
        buildPhase: resources
      - path: Content
        type: folder
        buildPhase: resources
    dependencies:
      - target: HouseCat
      - package: HouseCatCore
      - package: HouseCatStore
      - package: HouseCatGame
      - package: HouseCatModels
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.housecatgame.housecat.tests

  # UI tests: taps as a finger does, for what the simulator panel cannot show.
  HouseCatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: HouseCat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.housecatgame.housecat.uitests
        TEST_TARGET_NAME: HouseCat

  # WidgetKit extension: streak widgets, App Intents and the Nap Live Activity.
  HouseCatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/Sources
      - Widgets/Shared
    dependencies:
      - package: HouseCatCore
      - package: HouseCatUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/HouseCatWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.housecatgame.housecat]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: HouseCat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housecatgame.housecat.widgets
        PRODUCT_NAME: HouseCatWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Background Assets downloader for the homes' exterior packs (Apple-hosted), writing into the App Group the
  # app reads them from (the group needs the developer team to be registered).
  HouseCatDownloader:
    type: extensionkit-extension
    platform: iOS
    sources:
      - Downloader/Sources
    dependencies:
      - sdk: BackgroundAssets.framework
      - sdk: StoreKit.framework
    entitlements:
      path: Downloader/HouseCatDownloader.entitlements
      properties:
        com.apple.security.application-groups: [group.com.housecatgame.housecat]
    info:
      path: Downloader/Info.plist
      properties:
        CFBundleDisplayName: HouseCat
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
        BAAppGroupID: group.com.housecatgame.housecat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housecatgame.housecat.downloader
        PRODUCT_NAME: HouseCatDownloader
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  # Apple Watch app, embedded in the iPhone app (universal purchase). It keeps what the iPhone sends in its
  # own App Group in the widget's layout, so it reads it with the widget's files; the Content folder gives it
  # the same rules and lines.
  HouseCatWatch:
    type: application
    platform: watchOS
    sources:
      - Watch/Sources
      - Watch/Shared
      - Widgets/Shared/WidgetFiles.swift
      - Widgets/Shared/WatchMessages.swift
      - path: Shared/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Content
        type: folder
        buildPhase: resources
    dependencies:
      - package: HouseCatCore
      - target: HouseCatWatchComplication
    entitlements:
      path: Watch/HouseCatWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.housecatgame.housecat]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: HouseCat
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.housecatgame.housecat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housecatgame.housecat.watchkitapp
        PRODUCT_NAME: HouseCatWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  # The Watch complication: the streak and how the cat is, read from the Watch app's App Group.
  HouseCatWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - Watch/Complication
      - Watch/Shared
      - Widgets/Shared/WidgetFiles.swift
    dependencies:
      - package: HouseCatCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Watch/HouseCatWatchComplication.entitlements
      properties:
        com.apple.security.application-groups: [group.com.housecatgame.housecat]
    info:
      path: Watch/Complication/Info.plist
      properties:
        CFBundleDisplayName: HouseCat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.housecatgame.housecat.watchkitapp.complication
        PRODUCT_NAME: HouseCatWatchComplication
        SKIP_INSTALL: YES

  # Mac menu-bar cat: a MenuBarExtra app with App Sandbox on.
  HouseCatMac:
    type: application
    platform: macOS
    sources:
      - Mac/Sources
      - Shared/Sources
      - Widgets/Shared
      - path: Shared/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Content
        type: folder
        buildPhase: resources
      - path: App/Art
        type: folder
        buildPhase: resources
      - path: App/Audio
        type: folder
        buildPhase: resources
    dependencies:
      - package: HouseCatCore
      - package: HouseCatModels
      - package: HouseCatUI
      - package: HouseCatGame
    entitlements:
      path: Mac/HouseCatMac.entitlements
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: HouseCat
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.simulation-games
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Same bundle id as the iPhone app, for the universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: com.housecatgame.housecat
        PRODUCT_NAME: HouseCat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  HouseCat:
    build:
      targets:
        HouseCat: all
    run:
      config: Debug
      # Local products in the simulator when run from Xcode.
      storeKitConfiguration: Store/HouseCat.storekit
    test:
      config: Debug
      targets:
        - HouseCatTests
        - HouseCatUITests
  # The first-run smoke test on a Release build (debug switches compiled out), before a TestFlight upload. Only the
  # UI tests: the hosted unit tests use @testable, which a Release build does not allow. And only the UI tests that
  # need no HOUSECAT_ switch but HOUSECAT_SKIP_STORE: the button sweep, tracker, map and widget tests set up their
  # cat and screens with Debug-only switches, so on Release they could only time out.
  HouseCatSmoke:
    build:
      targets:
        HouseCat: all
    run:
      config: Release
    test:
      config: Release
      targets:
        - name: HouseCatUITests
          selectedTests:
            - FirstRunTests
            - RoomTouchTests
  HouseCatMac:
    build:
      targets:
        HouseCatMac: all
    run:
      config: Debug
